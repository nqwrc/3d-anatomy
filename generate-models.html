<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generate Test Models</title>
  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div style="padding: 20px; font-family: monospace;">
    <h1>Generate Test Models</h1>
    <button id="generateBtn" style="padding: 10px 20px; font-size: 16px;">Generate muscular.glb & skeletal.glb</button>
    <div id="output" style="margin-top: 20px; white-space: pre-wrap;"></div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

    const output = document.getElementById('output');
    const btn = document.getElementById('generateBtn');

    function log(msg) {
      output.textContent += msg + '\n';
      console.log(msg);
    }

    function createMuscularModel() {
      const group = new THREE.Group();
      group.name = 'muscular';

      // Muscle definitions: name, position, scale (width, height, depth), color
      const muscles = [
        // Arm - anterior
        { name: 'Biceps_brachii', position: [0, 25, 5], scale: [3, 15, 3], color: 0xff6b6b },
        { name: 'Brachialis', position: [0, 15, 3], scale: [2.5, 12, 2.5], color: 0xff8787 },
        { name: 'Coracobrachialis', position: [-5, 32, 2], scale: [2, 8, 2], color: 0xffa0a0 },

        // Arm - posterior
        { name: 'Triceps_brachii', position: [0, 20, -3], scale: [5, 20, 4], color: 0xff6b6b },
        { name: 'Triceps_long_head', position: [-5, 28, -5], scale: [3, 18, 3], color: 0xff8787 },

        // Shoulder
        { name: 'Deltoid', position: [0, 38, 0], scale: [12, 8, 8], color: 0xff6b6b },
        { name: 'Deltoid_anterior', position: [5, 38, 5], scale: [4, 6, 4], color: 0xff8787 },
        { name: 'Deltoid_lateral', position: [0, 38, 0], scale: [10, 5, 6], color: 0xff8787 },
        { name: 'Deltoid_posterior', position: [-5, 38, -3], scale: [4, 6, 4], color: 0xffa0a0 },

        // Chest
        { name: 'Pectoralis_major', position: [0, 28, 10], scale: [15, 18, 6], color: 0xff6b6b },
        { name: 'Pectoralis_minor', position: [8, 30, 8], scale: [4, 5, 2], color: 0xff8787 },

        // Back
        { name: 'Latissimus_dorsi', position: [0, 10, -8], scale: [18, 25, 4], color: 0xff6b6b },
        { name: 'Trapezius', position: [0, 40, -3], scale: [16, 12, 6], color: 0xff6b6b },
        { name: 'Trapezius_upper', position: [0, 45, -2], scale: [14, 6, 4], color: 0xff8787 },
        { name: 'Trapezius_middle', position: [0, 38, -4], scale: [12, 8, 3], color: 0xff8787 },
        { name: 'Trapezius_lower', position: [0, 30, -5], scale: [10, 10, 3], color: 0xffa0a0 },
        { name: 'Rhomboids', position: [0, 35, -6], scale: [8, 8, 2], color: 0xff6b6b },

        // Abdomen
        { name: 'Rectus_abdominis', position: [0, 5, 12], scale: [6, 25, 2], color: 0xff6b6b },
        { name: 'External_oblique', position: [8, 0, 8], scale: [10, 20, 2], color: 0xff8787 },
        { name: 'Internal_oblique', position: [-8, 0, 8], scale: [10, 20, 2], color: 0xffa0a0 },
        { name: 'Transversus_abdominis', position: [0, 0, 6], scale: [12, 18, 1], color: 0xffcccc },

        // Forearm
        { name: 'Brachioradialis', position: [6, 10, 2], scale: [2.5, 15, 2.5], color: 0xff6b6b },
        { name: 'Flexor_carpi_radialis', position: [4, 5, 3], scale: [2, 12, 2], color: 0xff8787 },
        { name: 'Extensor_carpi_radialis', position: [6, 5, -2], scale: [2, 12, 2], color: 0xffa0a0 },

        // Thigh
        { name: 'Rectus_femoris', position: [0, -20, 8], scale: [4, 28, 3], color: 0xff6b6b },
        { name: 'Vastus_lateralis', position: [6, -20, 5], scale: [5, 30, 4], color: 0xff8787 },
        { name: 'Vastus_medialis', position: [-6, -20, 5], scale: [5, 30, 4], color: 0xffa0a0 },
        { name: 'Vastus_intermedius', position: [0, -20, 3], scale: [4, 28, 3], color: 0xffcccc },
        { name: 'Biceps_femoris', position: [0, -25, -6], scale: [5, 25, 4], color: 0xff6b6b },
        { name: 'Semitendinosus', position: [-4, -28, -5], scale: [3, 22, 3], color: 0xff8787 },
        { name: 'Semimembranosus', position: [-5, -28, -3], scale: [3, 22, 3], color: 0xffa0a0 },
        { name: 'Adductor_longus', position: [-4, -15, 2], scale: [3, 15, 3], color: 0xff6b6b },

        // Lower leg
        { name: 'Tibialis_anterior', position: [3, -40, 5], scale: [2.5, 20, 2.5], color: 0xff6b6b },
        { name: 'Gastrocnemius', position: [0, -40, -4], scale: [6, 18, 5], color: 0xff6b6b },
        { name: 'Soleus', position: [0, -45, -2], scale: [5, 15, 4], color: 0xff8787 },
        { name: 'Peroneus_longus', position: [5, -40, 0], scale: [2.5, 20, 2.5], color: 0xffa0a0 },
      ];

      const materialCache = new Map();

      muscles.forEach(m => {
        // Create capsule geometry for muscle shape
        const geometry = new THREE.CapsuleGeometry(m.scale[0], m.scale[1], 8, 16);

        // Get or create material
        let material = materialCache.get(m.color);
        if (!material) {
          material = new THREE.MeshStandardMaterial({
            color: m.color,
            roughness: 0.7,
            metalness: 0.0,
            transparent: false,
            opacity: 1.0
          });
          materialCache.set(m.color, material);
        }

        const mesh = new THREE.Mesh(geometry, material);
        mesh.name = m.name;
        mesh.position.set(...m.position);
        mesh.userData = { originalName: m.name, system: 'muscular' };
        group.add(mesh);
      });

      return group;
    }

    function createSkeletalModel() {
      const group = new THREE.Group();
      group.name = 'skeletal';

      const boneMaterial = new THREE.MeshStandardMaterial({
        color: 0xf5f0e1,
        roughness: 0.9,
        metalness: 0.0
      });

      const bones = [
        // Skull
        { name: 'Skull', position: [0, 50, 0], scale: [8, 10, 8], type: 'sphere' },

        // Spine
        { name: 'Vertebral_column', position: [0, 5, 0], scale: [2, 45, 2], type: 'capsule' },
        { name: 'Cervical_spine', position: [0, 42, 0], scale: [2, 12, 2], type: 'capsule' },
        { name: 'Thoracic_spine', position: [0, 22, 0], scale: [2, 18, 2], type: 'capsule' },
        { name: 'Lumbar_spine', position: [0, 5, 0], scale: [2, 15, 2], type: 'capsule' },
        { name: 'Sacrum', position: [0, -8, 2], scale: [5, 5, 3], type: 'box' },

        // Rib cage
        { name: 'Rib_cage', position: [0, 20, 0], scale: [12, 20, 8], type: 'box' },
        { name: 'Sternum', position: [0, 22, 10], scale: [2, 15, 1], type: 'box' },

        // Upper limb - left
        { name: 'Clavicle_left', position: [-10, 40, 5], scale: [10, 1, 1], type: 'capsule' },
        { name: 'Scapula_left', position: [-15, 35, -3], scale: [6, 8, 2], type: 'box' },
        { name: 'Humerus_left', position: [-15, 25, 0], scale: [3, 26, 3], type: 'capsule' },
        { name: 'Radius_left', position: [-15, 8, 2], scale: [2, 22, 2], type: 'capsule' },
        { name: 'Ulna_left', position: [-15, 8, -2], scale: [2, 24, 2], type: 'capsule' },

        // Upper limb - right
        { name: 'Clavicle_right', position: [10, 40, 5], scale: [10, 1, 1], type: 'capsule' },
        { name: 'Scapula_right', position: [15, 35, -3], scale: [6, 8, 2], type: 'box' },
        { name: 'Humerus_right', position: [15, 25, 0], scale: [3, 26, 3], type: 'capsule' },
        { name: 'Radius_right', position: [15, 8, 2], scale: [2, 22, 2], type: 'capsule' },
        { name: 'Ulna_right', position: [15, 8, -2], scale: [2, 24, 2], type: 'capsule' },

        // Pelvis
        { name: 'Pelvis', position: [0, -5, 0], scale: [14, 6, 10], type: 'box' },
        { name: 'Ilium_left', position: [-9, -2, 0], scale: [4, 8, 6], type: 'box' },
        { name: 'Ilium_right', position: [9, -2, 0], scale: [4, 8, 6], type: 'box' },

        // Lower limb - left
        { name: 'Femur_left', position: [-8, -20, 0], scale: [3, 34, 3], type: 'capsule' },
        { name: 'Patella_left', position: [-8, -38, 6], scale: [3, 3, 2], type: 'box' },
        { name: 'Tibia_left', position: [-8, -48, 0], scale: [2, 30, 2], type: 'capsule' },
        { name: 'Fibula_left', position: [-10, -48, 0], scale: [1.5, 30, 1.5], type: 'capsule' },

        // Lower limb - right
        { name: 'Femur_right', position: [8, -20, 0], scale: [3, 34, 3], type: 'capsule' },
        { name: 'Patella_right', position: [8, -38, 6], scale: [3, 3, 2], type: 'box' },
        { name: 'Tibia_right', position: [8, -48, 0], scale: [2, 30, 2], type: 'capsule' },
        { name: 'Fibula_right', position: [10, -48, 0], scale: [1.5, 30, 1.5], type: 'capsule' },

        // Hands & feet (simplified)
        { name: 'Hand_left', position: [-15, -8, 0], scale: [4, 3, 3], type: 'box' },
        { name: 'Hand_right', position: [15, -8, 0], scale: [4, 3, 3], type: 'box' },
        { name: 'Foot_left', position: [-8, -65, 5], scale: [4, 2, 8], type: 'box' },
        { name: 'Foot_right', position: [8, -65, 5], scale: [4, 2, 8], type: 'box' },
      ];

      bones.forEach(b => {
        let geometry;
        switch (b.type) {
          case 'box':
            geometry = new THREE.BoxGeometry(b.scale[0], b.scale[1], b.scale[2]);
            break;
          case 'sphere':
            geometry = new THREE.SphereGeometry(b.scale[0], 16, 16);
            break;
          case 'capsule':
          default:
            geometry = new THREE.CapsuleGeometry(b.scale[0], b.scale[1], 8, 16);
            break;
        }

        const mesh = new THREE.Mesh(geometry, boneMaterial.clone());
        mesh.name = b.name;
        mesh.position.set(...b.position);
        mesh.userData = { originalName: b.name, system: 'skeletal' };
        group.add(mesh);
      });

      return group;
    }

    async function generateAndDownload() {
      btn.disabled = true;
      btn.textContent = 'Generating...';
      log('Starting model generation...');

      const exporter = new GLTFExporter();

      try {
        log('Creating muscular model...');
        const muscular = createMuscularModel();
        log(`Muscular model: ${muscular.children.length} meshes`);

        log('Exporting muscular.glb...');
        const muscularData = await new Promise((resolve, reject) => {
          exporter.parse(muscular, resolve, { binary: true });
        });

        const muscularBlob = new Blob([muscularData], { type: 'model/gltf-binary' });
        const muscularUrl = URL.createObjectURL(muscularBlob);
        const a = document.createElement('a');
        a.href = muscularUrl;
        a.download = 'muscular.glb';
        a.click();
        URL.revokeObjectURL(muscularUrl);
        log('muscular.glb downloaded!');

        log('Creating skeletal model...');
        const skeletal = createSkeletalModel();
        log(`Skeletal model: ${skeletal.children.length} meshes`);

        log('Exporting skeletal.glb...');
        const skeletalData = await new Promise((resolve, reject) => {
          exporter.parse(skeletal, resolve, { binary: true });
        });

        const skeletalBlob = new Blob([skeletalData], { type: 'model/gltf-binary' });
        const skeletalUrl = URL.createObjectURL(skeletalBlob);
        const b = document.createElement('a');
        b.href = skeletalUrl;
        b.download = 'skeletal.glb';
        b.click();
        URL.revokeObjectURL(skeletalUrl);
        log('skeletal.glb downloaded!');

        log('Done! Move the downloaded files to public/models/');
      } catch (error) {
        log('Error: ' + error.message);
        console.error(error);
      }

      btn.disabled = false;
      btn.textContent = 'Generate muscular.glb & skeletal.glb';
    }

    btn.addEventListener('click', generateAndDownload);
  </script>
</body>
</html>
