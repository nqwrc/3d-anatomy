<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Z-Anatomy Direct Test</title>
  <style>
    body { margin: 0; background: #0d1117; color: #e6edf3; font-family: monospace; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    #log { position: fixed; bottom: 0; left: 0; right: 0; max-height: 200px; overflow: auto; background: #161b22; border-top: 1px solid #30363d; padding: 10px; font-size: 12px; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="log"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "/node_modules/three/build/three.module.js",
      "three/addons/": "/node_modules/three/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const logEl = document.getElementById('log');
    function log(msg) {
      const t = new Date().toLocaleTimeString();
      logEl.textContent += `[${t}] ${msg}\n`;
      logEl.scrollTop = logEl.scrollHeight;
      console.log(msg);
    }

    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0d1117);

    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 0, 120);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 30;
    controls.maxDistance = 300;
    controls.maxPolarAngle = Math.PI * 0.95;
    controls.minPolarAngle = Math.PI * 0.05;
    controls.target.set(0, 0, 0);

    // Lights
    const ambient = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambient);
    const key = new THREE.DirectionalLight(0xffffff, 1.0);
    key.position.set(50, 100, 50);
    scene.add(key);
    const fill = new THREE.DirectionalLight(0x88aaff, 0.4);
    fill.position.set(-50, 50, -50);
    scene.add(fill);
    const rim = new THREE.DirectionalLight(0xffffee, 0.3);
    rim.position.set(0, -50, -100);
    scene.add(rim);
    const hemi = new THREE.HemisphereLight(0x88ccff, 0x332211, 0.3);
    scene.add(hemi);

    // Load model
    const loader = new GLTFLoader();
    
    async function loadModel(path, name) {
      log(`Loading ${name} from ${path}...`);
      try {
        const gltf = await new Promise((resolve, reject) => {
          loader.load(path, resolve, 
            (xhr) => {
              if (xhr.lengthComputable) {
                const pct = Math.round((xhr.loaded / xhr.total) * 100);
                log(`${name} progress: ${pct}%`);
              }
            },
            reject
          );
        });
        
        log(`${name} loaded! Meshes: ${gltf.scene.children.length}`);
        let meshCount = 0;
        gltf.scene.traverse(child => {
          if (child.isMesh) {
            meshCount++;
            child.material = child.material.clone();
            child.castShadow = false;
            child.receiveShadow = false;
            child.frustumCulled = true;
            log(`  Mesh: ${child.name || '(unnamed)'}`);
          }
        });
        log(`${name} total meshes: ${meshCount}`);
        
        scene.add(gltf.scene);
        
        // Center camera
        const box = new THREE.Box3().setFromObject(gltf.scene);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        const distance = maxDim * 1.5;
        camera.position.set(center.x, center.y, center.z + distance);
        controls.target.copy(center);
        controls.update();
        
        return gltf;
      } catch (e) {
        log(`ERROR loading ${name}: ${e.message}`);
        throw e;
      }
    }

    async function init() {
      try {
        await loadModel('/models/muscular.glb', 'muscular');
        // await loadModel('/models/skeletal.glb', 'skeletal');
        log('All models loaded!');
      } catch (e) {
        log(`Init failed: ${e.message}`);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    log('Starting direct test...');
    init().then(() => animate());
  </script>
</body>
</html>
